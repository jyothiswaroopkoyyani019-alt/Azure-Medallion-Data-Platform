name: Data Engineering Python CI

# Trigger this workflow every time someone pushes code to the repository
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Set Up Python Runtime
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Code Quality Scan Tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8

        # Scan the code, but only fail if there are critical Python crashes (like syntax blocks)
    - name: Run Syntax Scan Check
      run: |
        flake8 . --count --exit-zero --statistics

      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
